<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --paper: #f1f2ee;
        --paper-raised: #ffffff;
        --ink: #1c1f1e;
        --muted: #63665f;
        --accent: #2b5d63;
        --accent-soft: #dceae7;
        --line: #d8d9d2;
        --warn: #b8792a;
        --warn-soft: #f5ead8;
        --good: #3f7d5c;
        --bad: #b04438;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #14161a;
          --paper-raised: #1b1e22;
          --ink: #ededea;
          --muted: #9aa09a;
          --accent: #7ec1c2;
          --accent-soft: #1e3a3a;
          --line: #2b2e31;
          --warn: #e0a855;
          --warn-soft: #362508;
          --good: #6fbf95;
          --bad: #e08277;
        }
      }

      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        font-size: 13px;
        width: 300px;
        padding: 0;
        margin: 0;
        background: var(--paper);
        color: var(--ink);
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px;
        border-bottom: 1px solid var(--line);
      }
      .brand-mark {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        flex-shrink: 0;
      }
      .brand-text { flex: 1; min-width: 0; }
      header h1 {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0 0 2px;
      }
      .status-line { display: flex; align-items: center; gap: 6px; }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--bad);
        flex-shrink: 0;
      }
      .dot.on { background: var(--good); }
      .status-text { font-size: 11px; color: var(--muted); }

      .version-warning {
        display: none;
        margin: 8px 14px 0;
        padding: 7px 10px;
        background: var(--warn-soft);
        color: var(--warn);
        border-radius: 6px;
        font-size: 11px;
      }
      .version-warning.show { display: block; }

      section {
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
      }
      section h2 {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 10px;
        font-weight: 600;
      }

      #snoozeProject {
        width: 100%;
        font-size: 12px;
        padding: 5px 6px;
        margin-bottom: 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper-raised);
        color: var(--ink);
      }

      .snooze-row { display: flex; gap: 6px; }
      button.chip {
        flex: 1;
        font-size: 12px;
        padding: 6px 0;
        border: 1px solid var(--line);
        background: var(--paper-raised);
        color: var(--ink);
        border-radius: 6px;
        cursor: pointer;
      }
      button.chip:hover { border-color: var(--accent); color: var(--accent); }
      button.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

      ul.snooze-active-list { list-style: none; margin: 0; padding: 0; }
      ul.snooze-active-list li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 8px;
        padding: 7px 10px;
        background: var(--accent-soft);
        border-radius: 6px;
        font-size: 12px;
        color: var(--accent);
      }
      ul.snooze-active-list li span.proj { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      ul.snooze-active-list button {
        border: none;
        background: none;
        color: inherit;
        font-size: 12px;
        text-decoration: underline;
        cursor: pointer;
        padding: 0;
        flex-shrink: 0;
      }

      ul.sessions-list { list-style: none; margin: 0; padding: 0; }
      ul.sessions-list li {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 9px 0;
        border-bottom: 1px solid var(--line);
      }
      ul.sessions-list li:last-child { border-bottom: none; }
      ul.sessions-list li.empty {
        color: var(--muted);
        font-size: 12px;
        border-bottom: none;
      }
      ul.sessions-list .auto-label {
        font-size: 11px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      ul.sessions-list input[type="text"] {
        font-size: 12px;
        padding: 5px 7px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper-raised);
        color: var(--ink);
      }
      ul.sessions-list input[type="text"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

      table.channels { width: 100%; border-collapse: collapse; font-size: 12px; }
      table.channels th {
        text-align: left;
        font-weight: 500;
        color: var(--muted);
        padding-bottom: 8px;
      }
      table.channels th.center, table.channels td.center { text-align: center; }
      table.channels td { padding: 7px 0; }

      table.channels input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        width: 17px;
        height: 17px;
        border: 1.5px solid var(--line);
        border-radius: 5px;
        background: var(--paper-raised);
        cursor: pointer;
        display: inline-grid;
        place-content: center;
        margin: 0;
        vertical-align: middle;
      }
      table.channels input[type="checkbox"]::before {
        content: "";
        width: 9px;
        height: 6px;
        border-left: 2px solid var(--paper);
        border-bottom: 2px solid var(--paper);
        transform: rotate(-45deg) scale(0);
        transition: transform 0.1s ease;
      }
      table.channels input[type="checkbox"]:checked {
        background: var(--accent);
        border-color: var(--accent);
      }
      table.channels input[type="checkbox"]:checked::before { transform: rotate(-45deg) scale(1); }
      table.channels input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .field-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 12px;
      }
      .field-row:last-child { margin-bottom: 0; }
      .field-row input[type="number"] {
        width: 56px;
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 12px;
        padding: 3px 6px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--paper-raised);
        color: var(--ink);
      }

      /* Не <select> — нативный OS-выпадающий список в попапе расширения на
         Windows может увести фокус так, что весь попап закроется на клике
         по пункту, оборвав асинхронный патч настроек на середине. Кнопки
         не спавнят отдельное окно и этой проблеме не подвержены. */
      #phoneProviderRow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
      button.provider-chip {
        font-size: 12px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        background: var(--paper-raised);
        color: var(--ink);
        border-radius: 6px;
        cursor: pointer;
      }
      button.provider-chip:hover { border-color: var(--accent); color: var(--accent); }
      button.provider-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      button.provider-chip.active { background: var(--accent); border-color: var(--accent); color: var(--paper); }
      .phone-fields { display: none; flex-direction: column; gap: 6px; margin-bottom: 8px; }
      .phone-fields.show { display: flex; }
      .phone-fields input[type="text"] {
        font-size: 12px;
        padding: 5px 7px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper-raised);
        color: var(--ink);
      }
      .phone-fields input[type="text"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .lang-row {
        display: flex; gap: 6px; padding: 10px 14px 0; justify-content: flex-end;
      }
      .lang-chip {
        font-size: 11px; padding: 3px 9px; border-radius: 999px; cursor: pointer;
        border: 1px solid var(--line); background: transparent; color: var(--muted);
      }
      .lang-chip:hover { border-color: var(--accent); color: var(--accent); }
      .lang-chip.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
      .lang-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .phone-hint { font-size: 11px; color: var(--muted); margin: -3px 0 8px; }
      .phone-hint a { color: var(--accent); }
      .metrics-row {
        display: flex; align-items: flex-start; gap: 8px;
        font-size: 11.5px; color: var(--muted); margin: 8px 0 4px; cursor: pointer;
      }
      .metrics-row input { margin: 1px 0 0; flex: none; }

      .save-hint {
        font-size: 10.5px;
        color: var(--muted);
        margin-top: 10px;
        min-height: 13px;
      }
      .save-hint.show { color: var(--good); }

      ul.log {
        list-style: none;
        padding: 0;
        margin: 0;
        max-height: 160px;
        overflow-y: auto;
      }
      ul.log li {
        padding: 5px 0;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 11.5px;
        display: flex;
        gap: 6px;
      }
      ul.log li:last-child { border-bottom: none; }
      ul.log time {
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        flex-shrink: 0;
        color: var(--muted);
      }

      /* Пока не подключено к native host — показываем онбординг вместо
         настроек (они всё равно не сохранятся без демона). */
      .settings-ui { display: block; }
      body.disconnected .settings-ui { display: none; }
      #onboarding { display: none; }
      body.disconnected #onboarding { display: block; }

      #onboarding p.lead { font-size: 12.5px; color: var(--muted); margin: 0 0 12px; }
      button.primary {
        width: 100%;
        font-size: 12.5px;
        padding: 8px 0;
        border: none;
        background: var(--accent);
        color: var(--paper);
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
      }
      button.primary:hover { opacity: 0.9; }
      button.primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      #checkAgainHint {
        text-align: center;
        font-size: 11px;
        color: var(--muted);
        margin-top: 8px;
        min-height: 13px;
      }

      .report-row { margin-top: 10px; }
      button.ghost {
        width: 100%;
        font-size: 11.5px;
        padding: 7px 0;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        border-radius: 6px;
        cursor: pointer;
      }
      button.ghost:hover { border-color: var(--accent); color: var(--accent); }
    </style>
  </head>
  <body>
    <header>
      <img class="brand-mark" src="icons/icon48.png" alt="" />
      <div class="brand-text">
        <h1>AI Agent Notifier</h1>
        <div class="status-line">
          <span id="dot" class="dot"></span>
          <span id="statusText" class="status-text"></span>
        </div>
      </div>
    </header>
    <div id="versionWarning" class="version-warning"></div>

    <div id="langRow" class="lang-row">
      <button type="button" class="lang-chip" data-locale="ru" lang="ru">Русский</button>
      <button type="button" class="lang-chip" data-locale="en" lang="en">English</button>
      <button type="button" class="lang-chip" data-locale="es" lang="es">Español</button>
    </div>

    <section id="onboarding">
      <h2 data-i18n="onboarding.title"></h2>
      <p class="lead" data-i18n="onboarding.lead"></p>
      <button id="openWelcome" class="primary" type="button" data-i18n="onboarding.openGuide"></button>
      <div class="report-row">
        <button id="checkAgain" class="ghost" type="button" data-i18n="onboarding.checkAgain"></button>
      </div>
      <div id="checkAgainHint"></div>
    </section>

    <section class="settings-ui">
      <h2 data-i18n="snooze.title"></h2>
      <select id="snoozeProject"></select>
      <div class="snooze-row">
        <button class="chip" data-snooze="30" data-i18n="snooze.30min"></button>
        <button class="chip" data-snooze="60" data-i18n="snooze.1hour"></button>
        <button class="chip" data-snooze="180" data-i18n="snooze.3hours"></button>
      </div>
      <ul id="snoozeActiveList" class="snooze-active-list"></ul>
    </section>

    <section class="settings-ui">
      <h2 data-i18n="channels.title"></h2>
      <table class="channels">
        <thead>
          <tr>
            <th></th>
            <th class="center" data-i18n="channels.notification"></th>
            <th class="center" data-i18n="channels.badge"></th>
            <th class="center" data-i18n="channels.phone"></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td data-i18n="channels.needsApproval"></td>
            <td class="center"><input type="checkbox" data-event="permission_request" data-channel="notification" /></td>
            <td class="center"><input type="checkbox" data-event="permission_request" data-channel="badge" /></td>
            <td class="center"><input type="checkbox" data-event="permission_request" data-channel="phone" /></td>
          </tr>
          <tr>
            <td data-i18n="channels.taskDone"></td>
            <td class="center"><input type="checkbox" data-event="task_done" data-channel="notification" /></td>
            <td class="center"><input type="checkbox" data-event="task_done" data-channel="badge" /></td>
            <td class="center"><input type="checkbox" data-event="task_done" data-channel="phone" /></td>
          </tr>
        </tbody>
      </table>
    </section>

    <section class="settings-ui">
      <h2 data-i18n="phone.title"></h2>
      <div id="phoneProviderRow">
        <button type="button" class="provider-chip" data-provider="none" data-i18n="phone.providerNone"></button>
        <button type="button" class="provider-chip" data-provider="ntfy">ntfy</button>
        <button type="button" class="provider-chip" data-provider="webhook">Webhook</button>
        <button type="button" class="provider-chip" data-provider="pushover">Pushover</button>
        <button type="button" class="provider-chip" data-provider="telegram" data-i18n="phone.providerTelegram"></button>
        <button type="button" class="provider-chip" data-provider="relay" data-i18n="phone.providerRelay"></button>
      </div>

      <div id="phoneFieldsNtfy" class="phone-fields">
        <input type="text" id="phoneNtfyTopicUrl" data-i18n-placeholder="phone.ntfyPlaceholder" />
      </div>

      <div id="phoneFieldsWebhook" class="phone-fields">
        <input type="text" id="phoneWebhookUrl" data-i18n-placeholder="phone.webhookPlaceholder" />
      </div>

      <div id="phoneFieldsPushover" class="phone-fields">
        <input type="text" id="phonePushoverToken" placeholder="Application Token" />
        <input type="text" id="phonePushoverUserKey" placeholder="User Key" />
      </div>

      <div id="phoneFieldsTelegram" class="phone-fields">
        <input type="text" id="phoneTelegramBotToken" data-i18n-placeholder="phone.botTokenPlaceholder" />
        <input type="text" id="phoneTelegramChatId" placeholder="Chat ID" />
        <div class="phone-hint" data-i18n="phone.ownBotHint"></div>
      </div>

      <div id="phoneFieldsRelay" class="phone-fields">
        <button type="button" id="relayPairBtn" class="ghost" data-i18n="phone.pairButton"></button>
        <div id="relayPairStatus" class="phone-hint"></div>
        <label class="metrics-row">
          <input type="checkbox" id="phoneRelayMetrics" />
          <span data-i18n="phone.metricsLabel"></span>
        </label>
        <div class="phone-hint">
          <span data-i18n="phone.metricsHint"></span>
          <a href="https://github.com/NickitaCh/ai-agent-notifier/blob/master/PRIVACY.md" target="_blank" rel="noopener" data-i18n="phone.metricsLink"></a>
        </div>
      </div>

      <button id="phoneTest" class="ghost" type="button" data-i18n="phone.testButton"></button>
      <div id="phoneTestHint" class="save-hint"></div>
    </section>

    <section class="settings-ui">
      <h2 data-i18n="timeouts.title"></h2>
      <div class="field-row">
        <span data-i18n="timeouts.waitDecision"></span>
        <input type="number" id="permissionTimeoutSec" min="5" max="600" />
      </div>
      <div class="field-row">
        <span data-i18n="timeouts.doneDelay"></span>
        <input type="number" id="stopDebounceSec" min="0" max="600" />
      </div>
      <div id="saveHint" class="save-hint"></div>
      <div class="report-row">
        <button id="reportIssue" class="ghost" type="button" data-i18n="report.copyDiagnostics"></button>
      </div>
      <div class="report-row">
        <button id="sendFeedback" class="ghost" type="button" data-i18n="report.sendFeedback"></button>
      </div>
      <div id="feedbackHint" class="save-hint"></div>
    </section>

    <section class="settings-ui">
      <h2 data-i18n="sessions.title"></h2>
      <ul id="sessionsList" class="sessions-list"></ul>
    </section>

    <section class="settings-ui" style="border-bottom: none;">
      <h2 data-i18n="log.title"></h2>
      <ul id="log" class="log"></ul>
    </section>

    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
